<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="140"
viewBox="0 0 1200 140">

<defs>

<linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#58A6FF"/>
<stop offset="100%" stop-color="#7EE787"/>
</linearGradient>

</defs>

<rect
x="2"
y="2"
width="1196"
height="136"
rx="18"
fill="#0d1117"
stroke="url(#pulseGradient)"
stroke-width="2"/>

<polyline
fill="none"
stroke="#58A6FF"
stroke-width="3"
points="40,80 120,80 150,45 180,110 220,65 260,80 340,80 420,80 450,50 490,110 530,70 610,80 1160,80">

<animate
attributeName="stroke-dasharray"
values="0,1800;1800,0"
dur="4s"
repeatCount="indefinite"/>

</polyline>

<text
x="40"
y="35"
fill="#58A6FF"
font-family="JetBrains Mono"
font-size="18">

DEVELOPER PULSE

</text>

<text
x="40"
y="120"
fill="#8B949E"
font-family="JetBrains Mono"
font-size="14">

Live GitHub activity and engineering momentum.

</text>

<circle cx="1125" cy="35" r="6" fill="#3FB950">

<animate
attributeName="opacity"
values="1;.3;1"
dur="1.2s"
repeatCount="indefinite"/>

</circle>

</svg>
