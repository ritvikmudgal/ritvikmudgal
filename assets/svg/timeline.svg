<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="170"
viewBox="0 0 1200 170">

<defs>

<linearGradient id="timeline"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#58A6FF"/>

<stop offset="100%" stop-color="#7EE787"/>

</linearGradient>

</defs>

<line
x1="120"
y1="85"
x2="1080"
y2="85"
stroke="url(#timeline)"
stroke-width="4">

<animate
attributeName="stroke-dasharray"
values="1 1000;1000 0"
dur="4s"
repeatCount="indefinite"/>

</line>

<g>

<circle cx="150" cy="85" r="8" fill="#58A6FF">
<animate attributeName="r"
values="8;11;8"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="390" cy="85" r="8" fill="#58A6FF">
<animate attributeName="r"
values="8;11;8"
begin=".4s"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="630" cy="85" r="8" fill="#58A6FF">
<animate attributeName="r"
values="8;11;8"
begin=".8s"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="870" cy="85" r="8" fill="#58A6FF">
<animate attributeName="r"
values="8;11;8"
begin="1.2s"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="1050" cy="85" r="8" fill="#7EE787">
<animate attributeName="r"
values="8;12;8"
begin="1.6s"
dur="2s"
repeatCount="indefinite"/>
</circle>

</g>

<text x="120" y="45"
fill="#8B949E"
font-size="15"
font-family="JetBrains Mono">

START

</text>

<text x="340" y="45"
fill="#8B949E"
font-size="15"
font-family="JetBrains Mono">

WEB

</text>

<text x="590" y="45"
fill="#8B949E"
font-size="15"
font-family="JetBrains Mono">

AI

</text>

<text x="830" y="45"
fill="#8B949E"
font-size="15"
font-family="JetBrains Mono">

VENT

</text>

<text x="1000" y="45"
fill="#8B949E"
font-size="15"
font-family="JetBrains Mono">

LAB

</text>

</svg>
