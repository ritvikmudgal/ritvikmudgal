<svg xmlns="http://www.w3.org/2000/svg"
width="1400"
height="32">

<defs>

<linearGradient id="d"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#58A6FF"/>
<stop offset="50%" stop-color="#7EE787"/>
<stop offset="100%" stop-color="#58A6FF"/>

</linearGradient>

</defs>

<line
x1="0"
y1="16"
x2="1400"
y2="16"
stroke="url(#d)"
stroke-width="2"
stroke-dasharray="14 10">

<animate
attributeName="stroke-dashoffset"
from="0"
to="48"
dur="2s"
repeatCount="indefinite"/>

</line>

<circle cx="700" cy="16" r="4" fill="#58A6FF">

<animate
attributeName="r"
values="4;7;4"
dur="2s"
repeatCount="indefinite"/>

</circle>

</svg>
