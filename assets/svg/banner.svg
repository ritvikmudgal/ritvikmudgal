<svg width="1400" height="380" viewBox="0 0 1400 380" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0D1117"/>
<stop offset="100%" stop-color="#161B22"/>
</linearGradient>

<linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#58A6FF"/>
<stop offset="100%" stop-color="#7EE787"/>
</linearGradient>

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#21262D" stroke-width="1"/>
</pattern>

</defs>

<rect width="1400" height="380" fill="url(#bg)"/>
<rect width="1400" height="380" fill="url(#grid)" opacity=".55"/>

<line x1="0" y1="0" x2="1400" y2="0"
stroke="#58A6FF"
opacity=".15">

<animate
attributeName="y1"
values="0;380;0"
dur="8s"
repeatCount="indefinite"/>

<animate
attributeName="y2"
values="0;380;0"
dur="8s"
repeatCount="indefinite"/>

</line>

<polyline
fill="none"
stroke="url(#line)"
