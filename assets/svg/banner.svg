points="120,80
260,130
430,90
650,170
820,120
990,200
1180,140">

<animate
attributeName="stroke-dasharray"
values="0,2000;2000,0"
dur="5s"
repeatCount="indefinite"/>

</polyline>

<circle cx="260" cy="130" r="4" fill="#58A6FF">
